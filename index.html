<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Телеграм кошелек — макет</title>
  <style>
    :root{--bg:#000;--panel:#2f2f2f;--muted:#bdbdbd;--accent:#1d8cff;--white:#fff}
    html,body{height:100%;margin:0;font-family:Inter, Roboto, "Helvetica Neue", Arial, sans-serif;background:var(--bg);color:var(--white)}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center}
    /* сдвигаем панель чуть вверх */
    .panel{width:380px;max-width:92%;background:var(--panel);border-radius:12px;padding:30px 24px 24px;box-shadow:0 6px 30px rgba(0,0,0,0.6);transform:translateY(-6vh)}
    .center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
    /* иконка телеграм */
    .tg-ico{width:72px;height:72px;background:linear-gradient(180deg,#2a9df4,#198ee8);border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(20,60,120,0.35)}
    .tg-ico svg{width:44px;height:44px;filter:drop-shadow(0 1px 0 rgba(0,0,0,0.25))}
    h1{margin:0;font-size:18px;color:var(--white);font-weight:600}
    .muted{color:var(--muted);font-size:14px}

    /* сумма и курс */
    .amount{font-weight:700;font-size:20px}
    .amount span[contenteditable]{outline:none;border-bottom:2px dashed rgba(255,255,255,0.06);padding:2px 6px;border-radius:4px;cursor:text}
    .quote{font-size:13px;color:var(--muted)}
    .quote span[contenteditable]{background:transparent;padding:2px 6px;border-radius:4px;border:1px dashed rgba(255,255,255,0.04);cursor:text}

    /* синий ОК снизу */
    .ok-btn{margin-top:18px;background:var(--accent);color:var(--white);width:100%;padding:12px;border-radius:10px;text-align:center;font-weight:700;cursor:pointer;user-select:none}

    .hint{font-size:12px;color:var(--muted);margin-top:6px}
    @media (max-width:420px){.panel{padding:22px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="center">
        <div class="tg-ico" aria-hidden="true">
          <!-- Telegram SVG -->
          <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M185.6 69.6c-1.4.1-34.4 15.6-84 45.9-19.8 12.1-33.7 20.6-41.7 25.6-6.6 3.9-10.3 2.2-12-1.6-1.5-3.5-5.5-28-10.2-56.2-1.8-10.8-3.6-21.2-4-23.4-.9-4.6 1.8-5.6 3.9-6.1 1.7-.4 25.5-7.6 39.2-11.5 14.5-4.2 29.2-8.4 38.1-10.9 14.5-4.1 21.5 2.1 23 4.8 1.6 2.9 6.1 23.5 7.2 26.9 1.1 3.5 1.1 6.9-.2 7.9-1.3.9-6.1 1.8-9.1 2z" fill="#fff"/>
          </svg>
        </div>

        <h1>Телеграм кошелек</h1>
        <div class="muted">пополнение на сумму</div>

        <div class="amount">
          <span id="amountEditable" contenteditable="true">85</span>
          <span class="muted">тысяч рублей</span>
        </div>

        <div class="quote">"курс по доллару: " <span id="rateEditable" contenteditable="true">85</span></div>

        <div class="hint">Нажмите на число, чтобы изменить.</div>

        <div class="ok-btn" id="okBtn">ОК</div>
      </div>
    </div>
  </div>

  <script>
    function sanitizeInput(text){
      return text.replace(/[^0-9.,]/g, '').replace(/,+/g, '.');
    }

    function setupEditable(id){
      const el = document.getElementById(id);
      if(!el) return;
      el.addEventListener('input', ()=>{
        const cur = el.textContent || '';
        const clean = sanitizeInput(cur);
        if(cur !== clean) el.textContent = clean;
      });
      el.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter'){
          e.preventDefault();
          el.blur();
        }
      });
      el.addEventListener('blur', ()=>{
        let val = (el.textContent || '').trim();
        if(val === '') val = '0';
        const parts = val.split('.');
        if(parts.length > 2) val = parts.shift() + '.' + parts.join('');
        el.textContent = val;
      });
    }

    setupEditable('amountEditable');
    setupEditable('rateEditable');

    document.getElementById('okBtn').addEventListener('click', ()=>{
      const amount = document.getElementById('amountEditable').textContent.trim();
      const rate = document.getElementById('rateEditable').textContent.trim();
      alert('Сумма: ' + amount + ' тысяч рублей\\nКурс: ' + rate);
    });
  </script>
</body>
</html>
